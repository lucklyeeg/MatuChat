name: Windows Kurulum

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller

      - name: Uygulamayi derle
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MatuChat --collect-all webview --collect-all pythonnet --collect-all clr_loader --add-data "templates;templates" --add-data "static;static" app.py

      - name: Kurulum paketini olustur
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc .github\installer.iss
          Get-FileHash dist\MatuChat-Setup-1.3.0.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: MatuChat-Setup-1.3.0
          path: dist/MatuChat-Setup-1.3.0.exe

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MatuChat-Setup-1.3.0.exe
